{% extends 'base.html' %}
{% block title %}ลืมรหัสผ่าน{% endblock %}
{% block content %}
<section class="card form-card">
  <div class="eyebrow">กู้คืนบัญชี</div>
  <h1>ลืมรหัสผ่าน</h1>
  <p class="muted">กรอกชื่อผู้ใช้หรืออีเมล ตอบคำถามยืนยันตัวตน แล้วตั้งรหัสผ่านใหม่</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="field"><label for="identity">ชื่อผู้ใช้หรืออีเมล</label><input id="identity" name="identity" required maxlength="254" autocomplete="username" value="{{ request.form.get('identity','') }}"></div>
    <div class="field"><label for="security_answer">คุณชอบอะไร?</label><input id="security_answer" name="security_answer" required maxlength="120" autocomplete="off"></div>
    <div class="field"><label for="new_password">รหัสผ่านใหม่ (อย่างน้อย 8 ตัวอักษร)</label><input id="new_password" type="password" name="new_password" required minlength="8" maxlength="128" autocomplete="new-password"></div><small class="muted">รหัสผ่านใหม่ห้ามมีช่องว่าง ใช้สัญลักษณ์ได้ และห้ามซ้ำกับ 5 รหัสล่าสุด</small>
    <div class="field"><label for="confirm_password">ยืนยันรหัสผ่านใหม่</label><input id="confirm_password" type="password" name="confirm_password" required minlength="8" maxlength="128" autocomplete="new-password"></div>
    <button>ตั้งรหัสผ่านใหม่</button>
  </form>
  <p class="muted"><a href="{{ url_for('login') }}">กลับไปเข้าสู่ระบบ</a></p>
</section>
{% endblock %}
